<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title>How a game's DMA setup reaches the card through Dsdma</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#444"/></marker></defs>
<rect width="900" height="680" fill="#fff"/>
<rect x="100" y="20" width="460" height="56" rx="8" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.5"/>
<text x="330.0" y="53.0" text-anchor="middle" font-size="15" fill="#111">DOS game (Sound Blaster driver)</text>
<rect x="100" y="116" width="460" height="56" rx="8" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.5"/>
<text x="330.0" y="149.0" text-anchor="middle" font-size="15" fill="#111">8237 DMA ports 00-0F, 81-8B, C0-DE</text>
<rect x="100" y="212" width="460" height="56" rx="8" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.5"/>
<text x="330.0" y="245.0" text-anchor="middle" font-size="15" fill="#111">CPU faults on the access (I/O permission bitmap, #GP)</text>
<rect x="100" y="308" width="460" height="56" rx="8" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.5"/>
<text x="330.0" y="341.0" text-anchor="middle" font-size="15" fill="#111">Dsdma's #GP handler decodes the IN/OUT, emulates the 8237</text>
<rect x="100" y="404" width="460" height="56" rx="8" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.5"/>
<text x="330.0" y="437.0" text-anchor="middle" font-size="15" fill="#111">Card's D-DMA slave registers (I/O base F390)</text>
<rect x="100" y="500" width="460" height="56" rx="8" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.5"/>
<text x="330.0" y="533.0" text-anchor="middle" font-size="15" fill="#111">YMF724/744 card (SB, OPL3 and MPU-401 logic)</text>
<rect x="100" y="596" width="460" height="56" rx="8" fill="#fff3e0" stroke="#c77d1a" stroke-width="1.5"/>
<text x="330.0" y="629.0" text-anchor="middle" font-size="15" fill="#111">RAM: the DMA buffer</text>
<line x1="330" y1="76" x2="330" y2="115" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<text x="344" y="101.0" font-size="14" fill="#333">OUT 0Bh, 02h, 83h, 0Ah ...</text>
<line x1="330" y1="172" x2="330" y2="211" stroke="#444" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="344" y="197.0" font-size="14" fill="#333">hooked channel only (default: channel 1)</text>
<line x1="330" y1="268" x2="330" y2="307" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<line x1="330" y1="364" x2="330" y2="403" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<text x="344" y="389.0" font-size="14" fill="#333">translated access</text>
<line x1="330" y1="460" x2="330" y2="499" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<line x1="330" y1="556" x2="330" y2="595" stroke="#444" stroke-width="4" marker-end="url(#a)"/>
<text x="344" y="581.0" font-size="14" fill="#333">card moves the samples itself (PCI bus master)</text>
<rect x="690" y="202" width="190" height="76" rx="8" fill="#e9f6ec" stroke="#3b8a52" stroke-width="1.5"/>
<text x="785.0" y="227.0" text-anchor="middle" font-size="15" fill="#111">Dsdma.exe, loaded at</text>
<text x="785.0" y="245.0" text-anchor="middle" font-size="15" fill="#111">boot after setupds /s</text>
<text x="785.0" y="263.0" text-anchor="middle" font-size="15" fill="#111">exits with code 2</text>
<line x1="690" y1="240.0" x2="561" y2="240.0" stroke="#444" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="625.0" y="232.0" text-anchor="middle" font-size="13" fill="#333">installs</text>
<text x="625.0" y="258.0" text-anchor="middle" font-size="13" fill="#333">the trap</text>
</svg>
